<!DOCTYPE html>
<!-- informacion practica del centro, distinta de la de inicio -->
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{visita.titulo.pagina}">Planifica tu visita · Centro Cultural La Alameda</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<!-- misma cabecera que en inicio, pero con el titulo y el subtitulo de esta pagina -->
<div th:replace="~{fragments/comun :: cabecera(#{visita.titulo}, #{visita.subtitulo})}"></div>

<div class="barra">
    <div th:replace="~{fragments/comun :: navegacion('visita')}"></div>
    <!-- aqui la ruta es /visita para que el cambio de idioma no te lleve al inicio -->
    <div th:replace="~{fragments/comun :: idioma('/visita')}"></div>
</div>

<main class="contenido">
    <div class="info">
        <section class="bloque">
            <h2 th:text="#{visita.horario.titulo}">Horario</h2>
            <p th:text="#{visita.horario.texto}">Horario del centro.</p>
        </section>

        <section class="bloque">
            <h2 th:text="#{visita.llegar.titulo}">Cómo llegar</h2>
            <p th:text="#{visita.llegar.texto}">Cómo llegar al centro.</p>
        </section>

        <section class="bloque">
            <h2 th:text="#{visita.entradas.titulo}">Entradas e inscripciones</h2>
            <p th:text="#{visita.entradas.texto}">Información de entradas.</p>
        </section>

        <section class="bloque">
            <h2 th:text="#{visita.accesibilidad.titulo}">Accesibilidad</h2>
            <p th:text="#{visita.accesibilidad.texto}">Información de accesibilidad.</p>
        </section>
    </div>
</main>

<div th:replace="~{fragments/comun :: pie}"></div>

</body>
</html>
