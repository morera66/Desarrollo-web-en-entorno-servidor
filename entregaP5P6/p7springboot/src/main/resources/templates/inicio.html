<!DOCTYPE html>
<!-- muestra las actividades del centro-->
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{inicio.titulo.pagina}">Actividades · Centro Cultural La Alameda</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<!-- este div desaparece y en su sitio queda el header del fragmento -->
<div th:replace="~{fragments/comun :: cabecera(#{inicio.titulo}, #{inicio.subtitulo})}"></div>

<div class="barra">
    <!-- se pasa 'inicio' para que la navegacion marque esta pagina como activa -->
    <div th:replace="~{fragments/comun :: navegacion('inicio')}"></div>
    <!-- se pasa la ruta de esta pagina para que al cambiar de idioma se quede aqui -->
    <div th:replace="~{fragments/comun :: idioma('/')}"></div>
</div>

<main class="contenido">
    <h2 th:text="#{inicio.seccion}">Programación destacada</h2>

    <ul class="actividades">
        <!-- th:each recorre el array del controlador, cada actividad es una fila con 3 claves -->
        <li th:each="actividad : ${actividades}">
            <div class="tarjeta"
                 th:insert="~{fragments/comun :: actividad(#{${actividad[0]}}, #{${actividad[1]}}, #{${actividad[2]}})}">
            </div>
        </li>
    </ul>
</main>

<div th:replace="~{fragments/comun :: pie}"></div>

</body>
</html>
