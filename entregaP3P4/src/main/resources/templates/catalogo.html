<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo aula</title>
<link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <main class="page">

        <h1>Material del aula maker</h1>
        <!-- recorre el array, cada material es una fila -->
        <section class="card" th:each="material : ${materiales}">
            <h2 th:text="${material[1]}">Nombre del material</h2>
            <p>Código: <strong th:text="${material[0]}">CODIGO</strong></p>
            <p th:text="${material[2]}">Descripción</p>
            <a class="button" th:href="@{/materiales/{codigo}(codigo=${material[0]})}">Ver ficha</a>
        </section>

    </main>

</body>
</html>
