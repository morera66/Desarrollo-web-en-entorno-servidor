<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de préstamo aula</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <main class="page">
    <h1>Solicitud de préstamo</h1>

    <!-- elige el dto del modelo -->
    <form th:action="@{/solicitudes}" th:object="${solicitud}" method="post" class="card">

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" th:field="*{nombre}" maxlength="60">
        <!-- muestra el mensaje de error de ese campo -->
        <p class="error" th:errors="*{nombre}"></p>

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" th:field="*{correo}" maxlength="120">
        <p class="error" th:errors="*{correo}"></p>

        <label for="material">Material</label>
        <select id="material" th:field="*{material}">
            <option value="">Selecciona un material</option>

            <!-- opciones generadas desde el array-->
            <option th:each="m : ${materiales}" th:value="${m[0]}" th:text="${m[1]}">Material</option>
        </select>
        <p class="error" th:errors="*{material}"></p>

        <label for="unidades">Unidades (1 a 3)</label>
        <input type="number" id="unidades" th:field="*{unidades}" min="1" max="3">
        <p class="error" th:errors="*{unidades}"></p>

        <label for="fechaRecogida">Fecha de recogida</label>
        <input type="date" id="fechaRecogida" th:field="*{fechaRecogida}">
        <p class="error" th:errors="*{fechaRecogida}"></p>

        <label for="fechaDevolucion">Fecha de devolución</label>
        <input type="date" id="fechaDevolucion" th:field="*{fechaDevolucion}">
        <p class="error" th:errors="*{fechaDevolucion}"></p>

        <label for="motivo">Motivo del préstamo (30 a 400 caracteres)</label>
        <textarea id="motivo" th:field="*{motivo}" maxlength="400"></textarea>
        <p class="error" th:errors="*{motivo}"></p>

        <label>
            <input type="checkbox" th:field="*{aceptaNormas}">
            Acepto las normas de préstamo del aula maker
        </label>
        <p class="error" th:errors="*{aceptaNormas}"></p>

        <div class="actions">
            <button type="submit">Enviar solicitud</button>
            <a class="button secondary" th:href="@{/}">Volver al catálogo</a>
        </div>
    </form>
</main>
</body>
</html>
